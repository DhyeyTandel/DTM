services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dtm
      POSTGRES_PASSWORD: dtm
      POSTGRES_DB: dtm
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtm -d dtm"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Separate database for tests, kept in memory so it starts empty and never touches dev data.
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: dtm
      POSTGRES_PASSWORD: dtm
      POSTGRES_DB: dtm_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtm -d dtm_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
